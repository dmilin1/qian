<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>千 qian</title>
    <meta name="description" content="Learn the 1000 most common Mandarin words by ear: Taiwan Mandarin audio, tone-colored pinyin and spaced repetition." />
    <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-title" content="qian" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <script>
      // Apply the saved theme before first paint (mirrors src/components/ThemeSync.tsx).
      ;(function () {
        var theme = 'system'
        try {
          var raw = localStorage.getItem('qian.settings')
          var t = raw && JSON.parse(raw).settings.theme
          if (t === 'light' || t === 'dark') theme = t
        } catch (e) {}
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        var root = document.documentElement
        if (dark) root.classList.add('dark')
        root.style.colorScheme = dark ? 'dark' : 'light'
        // Browser chrome / status bar: match the resolved theme, not only the OS (THEME_COLORS in theme.ts).
        var c = dark ? '#141312' : '#f6f1e7'
        var ms = document.querySelectorAll('meta[name="theme-color"]')
        for (var i = 0; i < ms.length; i++) {
          ms[i].removeAttribute('media')
          ms[i].setAttribute('content', c)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>qian needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
